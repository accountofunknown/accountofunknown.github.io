<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — accountofunknown</title>
<meta name="description" content="Page not found.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>

<div class="frame">

  <header>
    <a class="mark" href="/">accountofunknown</a>
    <div class="header-meta">
      <a class="nav-link" href="/weblog/">weblog</a>
      <span class="path">~/404</span>
    </div>
  </header>

  <main>
    <div class="hero">
      <h1>Error Code: <span class="redact reveal glitch-loop" id="errorNumber" aria-label="404">404</span></h1>
      <p class="tagline">This page <span class="redact stamp-in" id="pageState" aria-label="redacted">▉▉▉▉▉▉</span></p>
      <p class="tagline" style="margin-top: 10px;">Some things stay unknown on purpose — this might just be one of them.</p>
    </div>

    <hr class="rule">

    <section>
      <h2>try instead</h2>
      <p><a class="back-link" href="/" style="margin-bottom:0;">&larr; back to the hub</a></p>
      <p><a class="back-link" href="/weblog/" style="margin-bottom:0;">&larr; browse the weblog</a></p>
    </section>
  </main>

  <footer>
    <a href="https://github.com/accountofunknown">github.com/accountofunknown</a>
    <span class="stamp-note">est. 2026</span>
  </footer>

</div>

<script>
(function(){
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function randBetween(min, max){
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  var GLITCH_MS = 150;

  /* ---- looping glitch shake on the "404" itself ---- */
  var numberEl = document.getElementById('errorNumber');
  if(numberEl && !reduceMotion){
    (function shakeLoop(){
      setTimeout(function(){
        numberEl.classList.add('glitch-active');
        setTimeout(function(){
          numberEl.classList.remove('glitch-active');
        }, GLITCH_MS);
        shakeLoop();
      }, randBetween(1800, 4200));
    })();
  }

  /* ---- redacted phrase cycling through the description line ---- */
  var wordEl = document.getElementById('pageState');
  if(wordEl && !reduceMotion){
    var phrases = [
      'is not here.',
      "doesn't exist.",
      'is missing.',
      'has relocated.',
      'has been removed.',
      'is invisible.',
      'stays redacted.',
      'has vanished.',
      'has gone dark.',
      'has been withheld.',
      'is untraceable.',
      'is unlisted.',
      'has been erased.'
    ];
    var lastIndex = -1;

    function glitchTo(text, reveal){
      wordEl.classList.add('glitch-active');
      setTimeout(function(){
        wordEl.classList.remove('glitch-active');
        wordEl.textContent = text;
        wordEl.setAttribute('aria-label', reveal ? text : 'redacted');
        wordEl.classList.toggle('reveal', reveal);
      }, GLITCH_MS);
    }

    function nextPhrase(){
      var i;
      do { i = randBetween(0, phrases.length - 1); } while(i === lastIndex && phrases.length > 1);
      lastIndex = i;
      return phrases[i];
    }

    function cycle(){
      glitchTo(nextPhrase(), true);

      var holdTime = randBetween(1000, 2200);
      setTimeout(function(){
        glitchTo('▉▉▉▉▉▉', false);
        var restTime = randBetween(1500, 3800);
        setTimeout(cycle, restTime);
      }, holdTime);
    }

    setTimeout(function(){
      setTimeout(cycle, randBetween(1000, 2200));
    }, 900);
  }
})();
</script>

</body>
</html>
